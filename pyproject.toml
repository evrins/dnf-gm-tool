[project]
name = "dnf-gm-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cachetools>=6.2.0",
    "loguru>=0.7.3",
    "polars>=1.34.0",
    "pydantic>=2.11.9",
    "pymysql>=1.1.2",
    "pyside6>=6.10.0",
    "sqlalchemy>=2.0.44",
    "zhconv",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pympler>=1.1",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.uv.sources]
zhconv = { git = "https://github.com/seamile/zhconv" }
